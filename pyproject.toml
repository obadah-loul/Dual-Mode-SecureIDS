[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secureids"
version = "0.1.0"
description = "Research prototype for centralized and simulated federated intrusion detection, with hierarchical classification and an explainable pretrained replay demo."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["secureids*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
