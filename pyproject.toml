[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secureids"
version = "0.1.0"
description = "Clean V2 rebuild for a secure, robust, and explainable federated intrusion detection system."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["secureids*"]
