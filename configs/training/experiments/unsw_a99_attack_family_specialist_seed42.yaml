# UNSW A9.9 attack-family specialist (seed 42) — SCAFFOLDING CONFIG.
# status: not_run_yet  -> this config has NOT been trained. Training requires a
# separate, explicit main-control approval and the manual command:
#   python -m secureids.cli train-attack-family-specialist \
#     --config configs/training/experiments/unsw_a99_attack_family_specialist_seed42.yaml --execute
# Without --execute the CLI only prints a dry-run summary and does not train.

dataset: unsw_nb15
task: attack_family_specialist
status: not_run_yet
experiment: unsw_a99_attack_family_specialist_seed42
model_name: AttackFamilySpecialistNet
seed: 42
input_dim: 192
num_attack_families: 9

hierarchical_data_dir: data/processed/unsw_nb15/hierarchical
attack_family_label_mapping_path: data/processed/unsw_nb15/hierarchical/attack_family_label_mapping.json

# The A9 binary detector is the ROUTER and is kept frozen (never retrained).
frozen_a9_router:
  checkpoint: models/final/final_unsw_hierarchical.pt
  identity: A9 corrected-protocol hierarchical baseline
  trainable: false
  binary_macro_f1: 0.894488

protocol: "A8.8 corrected UNSW benchmark protocol (train on 175,341-row partition = local UNSW_NB15_testing-set.csv; test on 82,332-row partition = local UNSW_NB15_training-set.csv)"

# The specialist is trained ONLY on UNSW train attack rows.
training_data:
  attack_rows_only: true
  split: train
  row_selection: "attack_family_mask == 1 AND y_attack_family != -1"

model:
  architecture: AttackFamilySpecialistNet
  hidden_dims: [256, 128]
  dropout: 0.20
  normalization: layernorm

loss:
  type: cross_entropy_attack_rows_only
  attack_family_loss: CrossEntropyLoss
  ignore_index: -1

class_imbalance:
  attack_family_class_weighting: train_split_sqrt_inverse_frequency_mean_normalized
  compute_weights_from: train_only
  allow_test_based_weights: false
  oversampling_enabled: false

training:
  seed: 42
  batch_size: 1024
  max_epochs: 40
  learning_rate: 0.001
  optimizer: adamw
  weight_decay: 0.0001
  early_stopping_metric: val_attack_family_macro_f1
  early_stopping_patience: 6

checkpoint_selection:
  monitor: val_attack_family_macro_f1
  use_validation_only: true
  select_by_test_metrics: false
  final_test_once_after_best_validation: true

rare_classes:
  - Shellcode
  - Worms

weak_classes_must_remain_visible:
  - Analysis
  - Backdoor
  - DoS
  - Shellcode
  - Worms

# All outputs are isolated under */experiments/* — never models/final or results/final.
outputs:
  checkpoint: models/experiments/unsw_a99_attack_family_specialist_seed42.pt
  result_dir: results/experiments/unsw_a99_attack_family_specialist_seed42
  training_history_csv: results/experiments/unsw_a99_attack_family_specialist_seed42/training_history.csv
  oracle_metrics_json: results/experiments/unsw_a99_attack_family_specialist_seed42/oracle_attack_family_metrics.json
  routed_metrics_json: results/experiments/unsw_a99_attack_family_specialist_seed42/routed_end_to_end_metrics.json
  per_class_attack_metrics_csv: results/experiments/unsw_a99_attack_family_specialist_seed42/per_class_attack_metrics.csv
  rare_class_metrics_csv: results/experiments/unsw_a99_attack_family_specialist_seed42/rare_class_metrics.csv
  attack_family_confusion_matrix_csv: results/experiments/unsw_a99_attack_family_specialist_seed42/attack_family_confusion_matrix.csv
  routing_summary_json: results/experiments/unsw_a99_attack_family_specialist_seed42/hierarchical_routing_summary.json
  training_config_snapshot_yaml: results/experiments/unsw_a99_attack_family_specialist_seed42/training_config_snapshot.yaml
  class_weight_snapshot_json: results/experiments/unsw_a99_attack_family_specialist_seed42/class_weight_snapshot.json
  model_summary_json: results/experiments/unsw_a99_attack_family_specialist_seed42/model_summary.json
  report_md: docs/experiments/UNSW_A99_ATTACK_FAMILY_SPECIALIST_SEED42_REPORT.md

safety:
  no_test_tuning: true
  attack_rows_only: true
  validation_only_selection: true
  freeze_a9_head1: true
  no_final_overwrite: true
  training_executed: false
  do_not_report_oracle_as_routed: true
  do_not_replace_a9_without_approval: true
