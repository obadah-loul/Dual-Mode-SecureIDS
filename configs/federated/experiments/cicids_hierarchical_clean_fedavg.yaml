dataset_warnings:
  - SlowHTTPTest to FTP-BruteForce remains dominant unresolved confusion.
  - FTP-BruteForce mean F1 is slightly lower than the old baseline.
  - Web-XSS and SQL-Injection have tiny support and must not be overclaimed.
  - EXP04 suggested remaining SlowHTTPTest/FTP issue may be feature-limited.

rare_classes:
  - DDoS-LOIC-UDP
  - DoS-Slowloris
  - Web-BruteForce
  - Web-XSS
  - SQL-Injection

safety:
  dry_run_writes_outputs: false
  training_allowed_in_scaffold: false
  evaluation_allowed_in_scaffold: false
  no_final_path_writes: true
  models_final_write_allowed: false
  results_final_write_allowed: false
  a11_excluded_as_final: true
  a11_used_as_final: false
  no_test_tuning: true
  do_not_rerun_dataset_optimization: true
