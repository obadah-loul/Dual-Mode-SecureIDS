  seed: 42
  rounds: 20
  client_fraction: 1.0
  local_epochs: 1
  execute_gate_required: true

training:
  seed: 42
  batch_size: 4096
  learning_rate: 0.001
  optimizer: adamw
  weight_decay: 0.0001
  threshold: 0.5

loss:
  binary_loss_weight: 1.0
  attack_loss_weight: 1.0
  ignore_index: -1

aggregation:
  strategy: fedavg

attack:
  enabled: false
  type: none
  malicious_fraction: 0.0
  seed: 42

integrity:
  sha256_update_hashing: true
  verify_before_aggregation: true
  secure_aggregation: future_optional

outputs:
  checkpoint: models/experiments/federated_security/cicids_hierarchical_clean_fedavg.pt
  result_dir: results/experiments/federated_security/cicids_hierarchical_clean_fedavg
