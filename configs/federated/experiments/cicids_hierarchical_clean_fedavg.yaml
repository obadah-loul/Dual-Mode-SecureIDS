model:
  architecture: SecureIDSHierarchicalAdvancedNet
  input_dim: 77
  attack_head_dim: 14
  hidden_dims: [256, 128, 128]
  dropout: 0.20
  normalization: layernorm
  attack_head_type: linear

hierarchical_data:
  processed_dir: data/processed/cicids2018/hierarchical
  feature_names: data/processed/cicids2018/hierarchical/feature_names.json
  attack_family_label_mapping: data/processed/cicids2018/hierarchical/attack_family_label_mapping.json
  preprocessing_manifest: data/processed/cicids2018/hierarchical/hierarchical_preprocessing_manifest.json

centralized_reference:
  checkpoint: models/final/final_cicids_hierarchical.pt
  sha256: 2C154253162CF18CD25D78F2AB77127CE51C26488D1F9BCABC93BAF591CD74C0
  status: FINALIZED_PROMOTED_WITH_WARNINGS
  use: reference_only
  warm_start_from_centralized: false
  metrics:
    binary_macro_f1: 0.9746037188199272
    attack_family_macro_f1: 0.8750940225320021
    rare_class_macro_f1: 0.780176838600292
