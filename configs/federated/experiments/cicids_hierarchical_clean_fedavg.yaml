    missed_as_benign_rate: 0.05122066001028537
    benign_false_alarm_rate: 0.00826727494990485

initialization: from_scratch

federation:
  num_clients: 5
  client_split: attack_family_aware_iid
  min_attack_family_support_per_client: 1
